<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 500" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Sky & Environment Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf4fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d6e8fa" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Car Gradient -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#0066cc"/>
      <stop offset="85%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#051428"/>
    </linearGradient>

    <!-- Window Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Road Surface Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Floating Cards -->
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0b2545" flood-opacity="0.18"/>
    </filter>

    <clipPath id="sceneClip">
      <rect x="0" y="0" width="740" height="500" rx="20"/>
    </clipPath>
  </defs>

  <!-- Embedded High-Performance 60FPS CSS Animations -->
  <style>
    /* Continuous Road Dashes Animation */
    @keyframes roadMotion {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-160px);
      }
    }
    .anim-road-stripes {
      animation: roadMotion 0.65s linear infinite;
    }

    /* Parallax Passing Trees */
    @keyframes treeScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-560px);
      }
    }
    .anim-trees-layer {
      animation: treeScroll 4.2s linear infinite;
    }

    /* Parallax Passing Pedestrians / People */
    @keyframes peopleScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-600px);
      }
    }
    .anim-people-layer {
      animation: peopleScroll 6.5s linear infinite;
    }

    /* Realistic Car Suspension Bounce & Road Vibration */
    @keyframes carSuspension {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      20% {
        transform: translateY(-2px) rotate(-0.35deg);
      }
      45% {
        transform: translateY(1.2px) rotate(0.2deg);
      }
      70% {
        transform: translateY(-1.5px) rotate(-0.15deg);
      }
      85% {
        transform: translateY(0.5px) rotate(0.1deg);
      }
    }
    .anim-car-body {
      animation: carSuspension 0.85s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    /* Spinning Alloy Wheel Rims */
    @keyframes rotateWheel {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .anim-wheel-front {
      transform-origin: 430px 375px;
      animation: rotateWheel 0.45s linear infinite;
    }
    .anim-wheel-rear {
      transform-origin: 240px 375px;
      animation: rotateWheel 0.45s linear infinite;
    }

    /* Headlight Glow Flicker */
    @keyframes beamPulse {
      0%, 100% {
        opacity: 0.65;
      }
      50% {
        opacity: 0.9;
      }
    }
    .anim-headlight-beam {
      animation: beamPulse 1.2s ease-in-out infinite;
    }

    /* Floating UI Badges */
    @keyframes floatCardTop {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-9px);
      }
    }
    .anim-badge-top {
      animation: floatCardTop 3.5s ease-in-out infinite;
    }

    @keyframes floatCardLeft {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(7px);
      }
    }
    .anim-badge-left {
      animation: floatCardLeft 4s ease-in-out infinite;
    }

    /* Ambient Pulsing Ping Dot */
    @keyframes pingDot {
      0% {
        transform: scale(0.9);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.4);
        opacity: 0.4;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.9;
      }
    }
    .anim-radar-ping {
      transform-origin: 540px 310px;
      animation: pingDot 2s ease-in-out infinite;
    }
  </style>

  <g clip-path="url(#sceneClip)">
    <!-- Ambient Backdrop Light Circles -->
    <circle cx="510" cy="210" r="210" fill="#e0effe" opacity="0.55"/>
    <circle cx="180" cy="150" r="110" fill="#bae6fd" opacity="0.35"/>

    <!-- Distant City Skyline Silhouette (Modern Metropole) -->
    <g opacity="0.45">
      <path d="M 40,350 L 40,270 L 75,270 L 75,230 L 115,230 L 115,290 L 145,290 L 145,190 L 180,190 L 180,160 L 210,160 L 210,310 L 245,310 L 245,250 L 285,250 L 285,350 Z" fill="#94a3b8"/>
      <path d="M 280,350 L 280,220 L 320,220 L 320,180 L 360,180 L 360,260 L 410,260 L 410,140 L 440,110 L 470,140 L 470,350 Z" fill="#64748b"/>
      <path d="M 465,350 L 465,240 L 515,240 L 515,195 L 565,195 L 565,270 L 605,270 L 605,210 L 650,210 L 650,350 Z" fill="#94a3b8"/>
      <path d="M 640,350 L 640,250 L 680,250 L 680,180 L 720,180 L 720,350 Z" fill="#cbd5e1"/>
    </g>

    <!-- Sidewalk Curb & Walking Esplanade -->
    <rect x="0" y="335" width="740" height="25" fill="#e2e8f0"/>
    <line x1="0" y1="335" x2="740" y2="335" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="0" y1="360" x2="740" y2="360" stroke="#94a3b8" stroke-width="3"/>

    <!-- ==================== PASSING TREES LAYER (PARALLAX 1) ==================== -->
    <g class="anim-trees-layer">
      <!-- Set A of Trees -->
      <!-- Tree 1: Lush Rounded Oak -->
      <g transform="translate(160, 240)">
        <rect x="18" y="55" width="8" height="42" rx="3" fill="#854d0e"/>
        <circle cx="22" cy="40" r="28" fill="#10b981"/>
        <circle cx="12" cy="30" r="18" fill="#34d399"/>
        <circle cx="32" cy="28" r="20" fill="#059669"/>
      </g>

      <!-- Tree 2: Elegant Pine / Cypress -->
      <g transform="translate(340, 225)">
        <rect x="12" y="70" width="6" height="42" rx="2" fill="#713f12"/>
        <polygon points="15,15 28,50 2,50" fill="#047857"/>
        <polygon points="15,35 34,75 -4,75" fill="#059669"/>
        <polygon points="15,60 38,95 -8,95" fill="#10b981"/>
      </g>

      <!-- Tree 3: Modern Boulevard Foliage -->
      <g transform="translate(520, 245)">
        <rect x="16" y="52" width="7" height="40" rx="3" fill="#854d0e"/>
        <ellipse cx="20" cy="35" rx="24" ry="32" fill="#0284c7"/>
        <ellipse cx="20" cy="30" rx="18" ry="24" fill="#38bdf8" opacity="0.8"/>
      </g>

      <!-- Tree 4: Urban Maple -->
      <g transform="translate(680, 235)">
        <rect x="16" y="60" width="8" height="42" rx="3" fill="#78350f"/>
        <circle cx="20" cy="42" r="26" fill="#10b981"/>
        <circle cx="30" cy="32" r="18" fill="#34d399"/>
        <circle cx="8" cy="35" r="16" fill="#059669"/>
      </g>

      <!-- Set B of Trees (Seamless Continuous Duplication) -->
      <g transform="translate(720, 240)">
        <rect x="18" y="55" width="8" height="42" rx="3" fill="#854d0e"/>
        <circle cx="22" cy="40" r="28" fill="#10b981"/>
        <circle cx="12" cy="30" r="18" fill="#34d399"/>
        <circle cx="32" cy="28" r="20" fill="#059669"/>
      </g>
      <g transform="translate(900, 225)">
        <rect x="12" y="70" width="6" height="42" rx="2" fill="#713f12"/>
        <polygon points="15,15 28,50 2,50" fill="#047857"/>
        <polygon points="15,35 34,75 -4,75" fill="#059669"/>
        <polygon points="15,60 38,95 -8,95" fill="#10b981"/>
      </g>
      <g transform="translate(1080, 245)">
        <rect x="16" y="52" width="7" height="40" rx="3" fill="#854d0e"/>
        <ellipse cx="20" cy="35" rx="24" ry="32" fill="#0284c7"/>
        <ellipse cx="20" cy="30" rx="18" ry="24" fill="#38bdf8" opacity="0.8"/>
      </g>
      <g transform="translate(1240, 235)">
        <rect x="16" y="60" width="8" height="42" rx="3" fill="#78350f"/>
        <circle cx="20" cy="42" r="26" fill="#10b981"/>
        <circle cx="30" cy="32" r="18" fill="#34d399"/>
        <circle cx="8" cy="35" r="16" fill="#059669"/>
      </g>
    </g>

    <!-- ==================== PASSING PEOPLE / PEDESTRIANS LAYER (PARALLAX 2) ==================== -->
    <g class="anim-people-layer">
      <!-- Person 1: Business Commuter with Briefcase -->
      <g transform="translate(220, 275)">
        <!-- Head -->
        <circle cx="10" cy="10" r="7" fill="#1e293b"/>
        <!-- Body / Jacket -->
        <path d="M 3,18 L 17,18 L 15,42 L 5,42 Z" fill="#0f172a"/>
        <!-- Briefcase -->
        <rect x="18" y="32" width="10" height="8" rx="2" fill="#854d0e"/>
        <line x1="21" y1="32" x2="25" y2="32" stroke="#451a03" stroke-width="2"/>
        <!-- Legs Walking -->
        <line x1="7" y1="42" x2="3" y2="60" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="13" y1="42" x2="17" y2="60" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Person 2: Urban Traveler with Rolling Trolley Luggage -->
      <g transform="translate(420, 272)">
        <circle cx="12" cy="10" r="7" fill="#0284c7"/>
        <path d="M 5,18 L 19,18 L 17,43 L 7,43 Z" fill="#1e40af"/>
        <!-- Rolling Luggage -->
        <rect x="-8" y="32" width="10" height="18" rx="3" fill="#0284c7"/>
        <line x1="-3" y1="32" x2="-3" y2="24" stroke="#64748b" stroke-width="2"/>
        <circle cx="-5" cy="51" r="2" fill="#0f172a"/>
        <circle cx="-1" cy="51" r="2" fill="#0f172a"/>
        <!-- Legs -->
        <line x1="9" y1="43" x2="5" y2="62" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="15" y1="43" x2="19" y2="62" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Person 3: Casual Commuter with Backpack & Headphones -->
      <g transform="translate(620, 274)">
        <circle cx="10" cy="10" r="7" fill="#0f766e"/>
        <!-- Backpack -->
        <path d="M -2,20 C -4,26 -4,34 -1,38 L 4,38 L 4,20 Z" fill="#0d9488"/>
        <!-- Torso -->
        <path d="M 3,18 L 17,18 L 15,42 L 5,42 Z" fill="#0f172a"/>
        <!-- Legs -->
        <line x1="7" y1="42" x2="12" y2="61" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="13" y1="42" x2="7" y2="61" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
      </g>

      <!-- Duplicated Set for Infinite Looping (Set B) -->
      <g transform="translate(820, 275)">
        <circle cx="10" cy="10" r="7" fill="#1e293b"/>
        <path d="M 3,18 L 17,18 L 15,42 L 5,42 Z" fill="#0f172a"/>
        <rect x="18" y="32" width="10" height="8" rx="2" fill="#854d0e"/>
        <line x1="7" y1="42" x2="3" y2="60" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="13" y1="42" x2="17" y2="60" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(1020, 272)">
        <circle cx="12" cy="10" r="7" fill="#0284c7"/>
        <path d="M 5,18 L 19,18 L 17,43 L 7,43 Z" fill="#1e40af"/>
        <rect x="-8" y="32" width="10" height="18" rx="3" fill="#0284c7"/>
        <line x1="9" y1="43" x2="5" y2="62" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="15" y1="43" x2="19" y2="62" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(1220, 274)">
        <circle cx="10" cy="10" r="7" fill="#0f766e"/>
        <path d="M 3,18 L 17,18 L 15,42 L 5,42 Z" fill="#0f172a"/>
        <line x1="7" y1="42" x2="12" y2="61" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
        <line x1="13" y1="42" x2="7" y2="61" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ==================== ROADWAY & INFINITE MOVING ROAD DASHES ==================== -->
    <path d="M 0,360 L 740,360 L 740,460 L 0,460 Z" fill="url(#roadGrad)"/>
    <line x1="0" y1="360" x2="740" y2="360" stroke="#334155" stroke-width="3"/>
    <line x1="0" y1="458" x2="740" y2="458" stroke="#0284c7" stroke-width="3" opacity="0.4"/>

    <!-- Infinite Scrolling Dashed Lane Lines -->
    <g class="anim-road-stripes">
      <!-- 800px of alternating stripes so when it translates -160px it loops flawlessly -->
      <line x1="-160" y1="412" x2="900" y2="412" 
            stroke="#f8fafc" stroke-width="5" 
            stroke-dasharray="90 70" 
            stroke-linecap="round" opacity="0.85"/>
      <line x1="-160" y1="442" x2="900" y2="442" 
            stroke="#f8fafc" stroke-width="3" 
            stroke-dasharray="60 100" 
            stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Speed Wind Streaks behind the car -->
    <g opacity="0.6">
      <line x1="110" y1="330" x2="160" y2="330" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="80" y1="345" x2="145" y2="345" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
      <line x1="125" y1="365" x2="175" y2="365" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- ==================== REALISTIC TRANSPORT VEHICLE ==================== -->
    <!-- Car Body with Driving Bounce Suspension Animation -->
    <g class="anim-car-body">
      <!-- Contact Shadow Beneath Car -->
      <ellipse cx="335" cy="384" rx="195" ry="14" fill="#020617" opacity="0.5"/>

      <!-- Sleek Aerodynamic Car Body -->
      <path d="M 160,335 
               C 175,308 215,304 250,300 
               L 295,255 
               C 320,244 395,244 430,255 
               L 472,300 
               C 510,305 545,316 545,338 
               C 545,350 535,356 512,356 
               L 475,356 
               C 470,332 445,316 418,316 
               C 390,316 368,332 362,356 
               L 275,356 
               C 270,332 248,316 220,316 
               C 192,316 170,332 165,356 
               L 145,356 
               C 135,356 135,342 160,335 Z" 
            fill="url(#carBodyGrad)"/>

      <!-- Luxury Windows with Reflections -->
      <path d="M 298,260 L 260,298 L 350,298 L 350,260 Z" fill="url(#glassGrad)"/>
      <path d="M 360,260 L 360,298 L 430,298 L 412,260 Z" fill="url(#glassGrad)"/>
      
      <!-- Driver Silhouette inside window -->
      <circle cx="330" cy="280" r="9" fill="#0f172a" opacity="0.6"/>
      <path d="M 320,298 C 320,289 340,289 340,298 Z" fill="#0f172a" opacity="0.6"/>

      <!-- Vibrant Racing / Belt Line Accent -->
      <path d="M 180,315 Q 340,305 520,320" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.9"/>

      <!-- Headlight Unit & Projector LED -->
      <path d="M 522,324 L 545,328 L 540,338 Z" fill="#bae6fd"/>
      <circle cx="538" cy="331" r="3.5" fill="#ffffff"/>

      <!-- Projected Headlight Cone onto the road (Flickers/Pulses) -->
      <polygon points="544,328 690,305 690,365 544,338" fill="url(#headlightBeam)" class="anim-headlight-beam"/>

      <!-- Rear Taillight Glow -->
      <path d="M 148,328 L 145,338 L 155,338 Z" fill="#ef4444"/>
    </g>

    <!-- ==================== ROTATING ALLOY WHEELS ==================== -->
    <!-- Front Wheel (Alloy spokes rotate rapidly) -->
    <g>
      <!-- Static Tire Tread & Wheel Well Shadow -->
      <circle cx="430" cy="375" r="35" fill="#0f172a"/>
      <circle cx="430" cy="375" r="27" fill="#1e293b"/>
      <circle cx="430" cy="375" r="17" fill="#94a3b8"/>
      <circle cx="430" cy="375" r="7" fill="#0066cc"/>
      
      <!-- Rotating Front Alloy Rim Spokes -->
      <g class="anim-wheel-front">
        <line x1="412" y1="375" x2="448" y2="375" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="430" y1="357" x2="430" y2="393" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="417" y1="362" x2="443" y2="388" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <line x1="443" y1="362" x2="417" y2="388" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Rear Wheel -->
    <g>
      <circle cx="240" cy="375" r="35" fill="#0f172a"/>
      <circle cx="240" cy="375" r="27" fill="#1e293b"/>
      <circle cx="240" cy="375" r="17" fill="#94a3b8"/>
      <circle cx="240" cy="375" r="7" fill="#0066cc"/>
      
      <!-- Rotating Rear Alloy Rim Spokes -->
      <g class="anim-wheel-rear">
        <line x1="222" y1="375" x2="258" y2="375" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="240" y1="357" x2="240" y2="393" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <line x1="227" y1="362" x2="253" y2="388" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
        <line x1="253" y1="362" x2="227" y2="388" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ==================== FLOATING UI BADGES & SATELLITE PINS ==================== -->
    <!-- Floating Badge 1: Instant Dispatch < 3 Min Arrival (Top Right) -->
    <g filter="url(#heroShadow)" class="anim-badge-top" transform="translate(440, 85)">
      <rect width="210" height="74" rx="18" fill="#ffffff"/>
      <circle cx="40" cy="37" r="22" fill="#e0f2fe"/>
      <path d="M33 37 L38 42 L48 31" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="74" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.2">INSTANT DISPATCH</text>
      <text x="74" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#0f172a">&lt; 3 Min Arrival</text>
    </g>

    <!-- Floating Badge 2: Verified Safest 5-Star Drivers (Left Middle) -->
    <g filter="url(#heroShadow)" class="anim-badge-left" transform="translate(45, 175)">
      <rect width="205" height="78" rx="18" fill="#0b2545"/>
      <circle cx="40" cy="39" r="22" fill="#153660"/>
      <!-- Shield Icon -->
      <path d="M 40,27 L 51,32 L 51,40 C 51,48 40,53 40,53 C 40,53 29,48 29,40 L 29,32 Z" fill="#38bdf8"/>
      <text x="74" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="0.8">VERIFIED SAFEST</text>
      <text x="74" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">5-Star Drivers</text>
    </g>

    <!-- Floating GPS Route Waypoint Pin with Radar Pulse -->
    <g transform="translate(540, 310)">
      <circle cx="0" cy="0" r="26" fill="#0066cc" class="anim-radar-ping"/>
      <circle cx="0" cy="0" r="14" fill="#0066cc"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>
  </g>
</svg>
