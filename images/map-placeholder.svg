<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <filter id="mapShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Land Area -->
  <rect width="600" height="450" fill="#f1f5f9"/>

  <!-- Park / Green Area -->
  <path d="M 0,280 C 60,250 140,290 180,360 L 120,450 L 0,450 Z" fill="#dcfce7" opacity="0.8"/>
  <path d="M 380,40 C 440,20 520,60 560,110 L 600,80 L 600,0 L 410,0 Z" fill="#dcfce7" opacity="0.8"/>

  <!-- Waterway / River -->
  <path d="M 0,110 C 120,130 200,90 320,160 C 440,230 480,260 600,240 L 600,290 C 480,310 420,280 300,210 C 180,140 100,180 0,160 Z" fill="#bae6fd" opacity="0.7"/>

  <!-- Secondary Roads -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="40" y1="0" x2="40" y2="450"/>
    <line x1="140" y1="0" x2="140" y2="450"/>
    <line x1="260" y1="0" x2="260" y2="450"/>
    <line x1="420" y1="0" x2="420" y2="450"/>
    <line x1="530" y1="0" x2="530" y2="450"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="340" x2="600" y2="340"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
  </g>

  <!-- Primary Highway / Main Express Route -->
  <path d="M 40,430 L 160,330 L 290,260 L 390,190 L 550,70" stroke="#fde047" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 40,430 L 160,330 L 290,260 L 390,190 L 550,70" stroke="#0066cc" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round" fill="none"/>

  <!-- Route Waypoint Dot 1 -->
  <circle cx="160" cy="330" r="7" fill="#0066cc"/>
  <circle cx="160" cy="330" r="4" fill="#ffffff"/>

  <!-- Main Transport Hub Pin (Glowing Pin) -->
  <g transform="translate(390, 190)">
    <ellipse cx="0" cy="18" rx="14" ry="5" fill="#000000" opacity="0.25"/>
    <path d="M 0,-40 C -16,-40 -24,-24 -24,-10 C -24,10 0,20 0,20 C 0,20 24,10 24,-10 C 24,-24 16,-40 0,-40 Z" fill="#dc2626"/>
    <circle cx="0" cy="-20" r="9" fill="#ffffff"/>
    <circle cx="0" cy="-20" r="5" fill="#0b2545"/>
  </g>

  <!-- Interactive Map Badge Overlay -->
  <g filter="url(#mapShadow)" transform="translate(30, 30)">
    <rect width="240" height="90" rx="12" fill="#ffffff"/>
    <rect x="14" y="16" width="36" height="36" rx="8" fill="#e0f2fe"/>
    <circle cx="32" cy="34" r="8" fill="#0284c7"/>
    <text x="62" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a">TransMove HQ Hub</text>
    <text x="62" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">452 Metro Boulevard, Suite 100</text>
    <text x="14" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#0066cc">Live GPS Hub • Open 24/7</text>
  </g>

  <!-- Zoom Controls Overlay -->
  <g filter="url(#mapShadow)" transform="translate(535, 330)">
    <rect width="36" height="74" rx="8" fill="#ffffff"/>
    <text x="18" y="27" font-family="sans-serif" font-size="20" font-weight="bold" fill="#334155" text-anchor="middle" cursor="pointer">+</text>
    <line x1="8" y1="37" x2="28" y2="37" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="18" y="60" font-family="sans-serif" font-size="20" font-weight="bold" fill="#334155" text-anchor="middle" cursor="pointer">−</text>
  </g>
</svg>
