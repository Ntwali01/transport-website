<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sedanGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="70%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#031127"/>
    </linearGradient>
    <linearGradient id="winSedan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background Badge / Grid -->
  <rect width="400" height="240" rx="16" fill="#f8fafc"/>
  <circle cx="200" cy="120" r="85" fill="#e0f2fe" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="180" rx="150" ry="12" fill="#0f172a" opacity="0.25"/>

  <!-- Sedan Car Body -->
  <g transform="translate(30, 45)">
    <path d="M 35,100 C 45,78 75,75 110,72 L 150,38 C 175,28 235,28 265,38 L 305,72 C 325,75 345,82 345,100 C 345,110 335,116 320,116 L 285,116 C 280,98 260,86 238,86 C 216,86 198,98 193,116 L 125,116 C 120,98 102,86 80,86 C 58,86 40,98 35,116 L 20,116 C 12,116 12,106 35,100 Z" fill="url(#sedanGrad)"/>

    <!-- Windows -->
    <path d="M 152,42 L 118,70 L 195,70 L 195,42 Z" fill="url(#winSedan)" opacity="0.85"/>
    <path d="M 203,42 L 203,70 L 260,70 L 246,42 Z" fill="url(#winSedan)" opacity="0.85"/>

    <!-- Headlight & Tail Light -->
    <path d="M 330,88 L 343,92 L 338,98 Z" fill="#67e8f9"/>
    <path d="M 22,86 L 20,94 L 28,94 Z" fill="#ef4444"/>

    <!-- Wheels -->
    <!-- Front Wheel -->
    <g transform="translate(240, 116)">
      <circle cx="0" cy="0" r="28" fill="#0f172a"/>
      <circle cx="0" cy="0" r="21" fill="#334155"/>
      <circle cx="0" cy="0" r="13" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#0066cc"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#f8fafc" stroke-width="2.5"/>
    </g>
    <!-- Rear Wheel -->
    <g transform="translate(80, 116)">
      <circle cx="0" cy="0" r="28" fill="#0f172a"/>
      <circle cx="0" cy="0" r="21" fill="#334155"/>
      <circle cx="0" cy="0" r="13" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="6" fill="#0066cc"/>
      <line x1="-14" y1="0" x2="14" y2="0" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="-10" y1="-10" x2="10" y2="10" stroke="#f8fafc" stroke-width="2.5"/>
      <line x1="10" y1="-10" x2="-10" y2="10" stroke="#f8fafc" stroke-width="2.5"/>
    </g>

    <!-- Side Line Accent -->
    <path d="M 45,82 Q 180,74 320,86" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
</svg>
