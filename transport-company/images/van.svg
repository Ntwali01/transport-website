<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="winVan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="#f8fafc"/>
  <circle cx="200" cy="120" r="85" fill="#e0f2fe" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="184" rx="160" ry="13" fill="#0f172a" opacity="0.25"/>

  <!-- Van Body -->
  <g transform="translate(20, 32)">
    <!-- Main Boxy/Sleek Silhouette -->
    <path d="M 28,128 
             L 28,42 
             C 28,34 38,28 50,28 
             L 260,28 
             C 285,28 305,40 320,68 
             L 345,95 
             C 355,108 355,124 350,132 
             L 315,132 
             C 310,110 288,98 264,98 
             C 240,98 220,110 214,132 
             L 125,132 
             C 120,110 98,98 74,98 
             C 50,98 32,110 28,132 Z" 
          fill="url(#vanGrad)"/>

    <!-- Windows (Spacious passenger shuttle) -->
    <!-- Front windshield/driver window -->
    <path d="M 270,36 L 312,68 L 332,90 L 260,90 L 260,36 Z" fill="url(#winVan)" opacity="0.85"/>
    <!-- Middle passenger window -->
    <rect x="180" y="36" width="70" height="54" rx="4" fill="url(#winVan)" opacity="0.85"/>
    <!-- Rear passenger window -->
    <rect x="95" y="36" width="75" height="54" rx="4" fill="url(#winVan)" opacity="0.85"/>
    <rect x="36" y="36" width="50" height="54" rx="4" fill="url(#winVan)" opacity="0.85"/>

    <!-- Sliding Door seam -->
    <line x1="175" y1="34" x2="175" y2="128" stroke="#0f172a" stroke-width="2" opacity="0.4"/>
    <rect x="182" y="98" width="14" height="4" rx="2" fill="#e2e8f0"/>

    <!-- Lights -->
    <path d="M 345,104 L 352,108 L 348,116 Z" fill="#67e8f9"/>
    <rect x="26" y="70" width="5" height="24" rx="2" fill="#ef4444"/>

    <!-- Wheels -->
    <g transform="translate(264, 132)">
      <circle cx="0" cy="0" r="30" fill="#0f172a"/>
      <circle cx="0" cy="0" r="22" fill="#334155"/>
      <circle cx="0" cy="0" r="13" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="5" fill="#2563eb"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#f8fafc" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#f8fafc" stroke-width="2"/>
    </g>
    <g transform="translate(74, 132)">
      <circle cx="0" cy="0" r="30" fill="#0f172a"/>
      <circle cx="0" cy="0" r="22" fill="#334155"/>
      <circle cx="0" cy="0" r="13" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="5" fill="#2563eb"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#f8fafc" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="15" stroke="#f8fafc" stroke-width="2"/>
    </g>

    <path d="M 35,98 Q 180,94 340,104" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
</svg>
